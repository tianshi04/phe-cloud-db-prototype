[package]
name = "client-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
paillier-crypto = { path = "../paillier-crypto" }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rand = "0.8"

[lints]
workspace = true
